[package]
name = "ryokan"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
# Web framework + async runtime
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
# Stream combinators — buffer_unordered for bounded-concurrency
# fan-out, used in services/auto_search to parallelise per-candidate
# classification.
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-br", "compression-gzip", "set-header"] }

# Templating
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies"] }

# HTML scraping
scraper = "0.22"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
bcrypt = "0.16"
rand = "0.8"
hex = "0.4"
subtle = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# API documentation
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
urlencoding = "2"
regex-lite = "0.1"
# fancy-regex is used only by the Custom Formats parser (Sonarr-v4
# compat). Trash-guides anime CFs rely on look-around and nested
# character classes, which regex-lite (and even the main `regex` crate)
# do not support — fancy-regex adds PCRE-style backtracking. We keep
# regex-lite as the default for Ryokan's own internal regexes because
# they don't need look-around and we want the linear-time guarantee.
fancy-regex = "0.14"
sha2 = "0.10"
ammonia = "4"

# Anime release title tokenization (wraps bundled anitomy C++ lib, compiled via cc)
anitomy = "0.2"
