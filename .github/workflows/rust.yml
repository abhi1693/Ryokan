name: Rust

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        # `--features test-support` enables the `ryokan::test_support`
        # re-export that integration tests under `tests/` depend on.
        # Without the flag those tests silently skip (via
        # `required-features` in Cargo.toml) and clippy wouldn't touch
        # them — running with the flag means the lint pass covers both
        # unit and integration targets.
        run: cargo clippy --workspace --all-targets --features test-support -- -D warnings
      - name: Build
        run: cargo build --workspace --locked --verbose
      - name: Test
        # Same reason as clippy: flip on `test-support` so integration
        # tests under `tests/` actually execute. Release builds and
        # Docker images deliberately leave the feature off so the test
        # helpers don't ship to production.
        run: cargo test --workspace --locked --features test-support --verbose

  msrv:
    # Verify the crate still builds on the declared MSRV. Cargo.toml's
    # `rust-version = "1.95"` is otherwise decorative — the main `build`
    # job uses `stable`, so a dep bump that silently requires a newer
    # toolchain would pass CI while leaving users pinned to 1.95 stranded.
    # Build-only (no test / clippy / fmt) because those produce
    # noisy MSRV-unrelated churn on older toolchains and the signal we
    # care about here is strictly "does the code compile on 1.95?"
    name: MSRV (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Build on MSRV
        run: cargo build --workspace --locked --verbose
